name: Build iOS IPA (BiDeal)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Verificar Versión de Xcode
        run: |
          xcodebuild -version

      - name: Compilar y Archivar Proyecto iOS
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project BiDeal.xcodeproj \
            -scheme BiDeal \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BiDeal.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Inspeccionar Errores de Compilación (si falló)
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            echo "=== ERRORES DE COMPILACIÓN DETECTADOS ==="
            grep -E "error: " xcodebuild.log | head -n 40
            while IFS= read -r line; do
              echo "::error title=Xcode Compilation::$line"
            done < <(grep -E "error: " xcodebuild.log | head -n 20)
            echo "========================================="
          fi

      - name: Empaquetar a Archivo IPA
        run: |
          mkdir -p build/Payload
          cp -R build/BiDeal.xcarchive/Products/Applications/BiDeal.app build/Payload/
          cd build
          zip -qr BiDeal.ipa Payload
          ls -la BiDeal.ipa

      - name: Subir Archivo IPA como Artefacto de Descarga
        uses: actions/upload-artifact@v4
        with:
          name: BiDeal-iOS-IPA
          path: build/BiDeal.ipa
          retention-days: 14
